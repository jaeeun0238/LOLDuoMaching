<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/signup/signup.css">
    <title>회원가입 페이지</title>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <h1>로고</h1>
        </div>
        <div class="header-center">
            <h1>롤 듀오 찾기</h1>
        </div>
        <div class="header-right">
            <nav>
                <ul class="nav-links">
                    <li><a href="/login">로그인</a></li>
                    <li><a href="/signup">회원가입</a></li>
                    <li><a href="/userProfile">유저프로필</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" placeholder="Search" />
                <button>🔍</button>
            </div>
        </div>
    </header>
    <nav class="tabs">
        <ul>
            <li><a href="#게시판">게시판</a></li>
            <li><a href="#잡담방">잡담방</a></li>
            <li><a href="#내 프로필">내 프로필</a></li>
            <li><a href="#section4">Section 4</a></li>
        </ul>
    </nav>
    <div class="signup-container">
        <form id="signupForm">
            <div class="input-group">
                <label for="email">이메일 (ID)</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" required>
            </div>
            <div class="input-group">
                <label for="confirmPassword">비밀번호 확인</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <div class="input-group">
                <label for="name">이름</label>
                <input type="text" id="userName" required>
            </div>
            <div class="input-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" required>
            </div>
            <button type="submit">회원가입</button>
        </form>
        <p id="signupMessage"></p>

        <!-- 이메일 인증 섹션을 항상 보여줍니다. -->
        <div class="verification-container">
            <h2>이메일 인증</h2>
            <div class="input-group">
                <label for="verificationCode">인증 코드</label>
                <input type="text" id="verificationCode" required>
            </div>
            <button id="verifyButton">인증하기</button>
            <p id="verificationMessage"></p>
        </div>
    </div>

    <script src="/static/signup/signup.js"></script>
</body>

</html>
