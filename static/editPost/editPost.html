<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롤 듀오 찾기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/editPost/script.js"></script>
</head>

<!--     --     --     --     --     --     --     --     --     -->

<body>
  <header class="header1">
    <div class="row g-0 header-container">

      <div class="title ">
        롤 듀오 매칭
      </div>
      <div class="header-right">
        <nav>
          <ul class="nav-links">
            <li><a href="#login">로그인</a></li>
            <li><a href="#signup">회원가입</a></li>
            <li><a href="#mypage">마이페이지</a></li>
          </ul>
        </nav>
        <div class="search-bar">
          <input type="text" placeholder="Search" />
          <button>🔍</button>
        </div>
      </div>
      <div class="page ">
        게시글 수정
      </div>
    </div>
  </header>
  <header class="header2">
    <div class="row g-0 header-container2">
      <div class="header-item2 this-title">
        <h2>게시판</h2>
      </div>
      <div class="header-item2">
        <h2>프로필</h2>
      </div>
      <div class="header-item2">
        <h2>마이페이지</h2>
      </div>
      <div class="header-item2">
        <h2>잡담방</h2>
      </div>
    </div>
  </header>


  <div class="post-feed">
    <div class="container">
      <!-- 게시글 -->
      <div class="width100">


        <!--------------------------------->
        <!-- <div class="profile-card"> -->
        <form id="creatPostForm">
          <div class="input-group">
            <label for="postTitle">제목</label>
            <input type="postTitle" id="postTitle" required>
          </div>

          <div class="input-group">
            <label for="postImage">이미지</label>
            <!-- url -->
            <input type="postImage" id="postImage" required>
          </div>

          <div class="input-group">
            <label for="postContent">content</label>
            <input type="postContent" id="postContent" required>
          </div>
          <div class="row-feed">
            <button class="greenButton" id="postSaveButton">저장</button>
            <button class="redButton" id="postDeleatButton">삭제</button>
          </div>
        </form>
      </div>
      <!--------------------------------->
    </div>

  </div>


  </div>
  </div>


</body>

</html>
