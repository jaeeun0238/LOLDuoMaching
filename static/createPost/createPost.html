<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>채팅</title>
    <link rel="stylesheet" href="/static/createPost/createPost.css">
    <script src="../socket.io/socket.io.js"></script>
    <script src="/static/createPost/createPost.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <a href="/"><img
                    src="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200/e7db6664499143.5f749c02d235f.gif"
                    alt="로고" style="width: 100px; height: 100px;"></a>
        </div>
        <div class="header-center">

            <h1>롤 듀오 찾기</h1>
        </div>
        <div class="header-right">
            <nav>
                <ul class="nav-links">
                    <li><a href="/login">로그인</a></li>
                    <li><a href="/signup">회원가입</a></li>
                    <li><a href="/setProfile">프로필 설정</a></li>
                    <li><a href="#" id="logoutButton">로그아웃</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <nav class="tabs">
        <ul>
            <li><a href="/newsFeed">게시판</a></li>
            <li><a href="/createPost">글 쓰기</a></li>
            <li><a href="#section4">도움말</a></li>
        </ul>
    </nav>

    <div class="post-feed">
        <div class="container">
            <!-- 게시글 -->

            <!--------------------------------->
            <div class="profile-card">
                <div class="card-content">
                    <form id="createPostForm"> <!-- 수정된 부분 -->
                        <div class="input-group">
                            <label for="postTitle">제목</label>
                            <input type="text" id="postTitle" required> <!-- type 수정 -->
                        </div>

                        <div class="input-group">
                            <label for="postImage">이미지 추가</label>
                            <!-- url -->
                            <input type="text" id="imageUrl" required> <!-- id 수정 -->
                        </div>

                        <div class="input-group">
                            <label for="postContent">내용</label>
                            <textarea id="postContent" required></textarea> <!-- input에서 textarea로 수정 -->
                        </div>

                        <button id="postSaveButton" type="submit">저장</button> <!-- type 추가 -->
                    </form>
                </div>
                <!--------------------------------->
            </div>
        </div>
    </div>
</body>

</html>
