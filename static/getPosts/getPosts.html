<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롤 듀오 찾기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/getPosts/script.js"></script>
</head>

<body>
  <header class="header1">
    <div class="row g-0 header-container">
      <div class="title">
        롤 듀오 매칭
      </div>
      <div class="page">
        게시판
      </div>
    </div>
  </header>

  <header class="header2">
    <div class="row g-0 header-container2">
      <div class="header-item2 this-title">
        <h2>게시판</h2>
      </div>
      <div class="header-item2">
        <h2>프로필</h2>
      </div>
      <div class="header-item2">
        <h2>마이페이지</h2>
      </div>
      <div class="header-item2">
        <h2>잡담방</h2>
      </div>
    </div>
    </div>
  </header>

  <div>
    <div class="row-feed">
      <div class="post-feed">
        <div class="container">
          <div class="sort-container">
            <label for="sort-dropdown">정렬 기준:</label>
            <select id="sort-dropdown">
              <option value="likes">좋아요 순</option>
              <option value="title">제목 사전순</option>
              <option value="updatedAt">최신 수정 순</option>
            </select>
          </div>
          <div id="post-container"></div>
        </div>
      </div>

      <div class="new-feed container">
        <div class="header-item">
          <h2>게시판</h2>
        </div>
        <div class="header-item2">
          <h2>프로필</h2>
        </div>
        <div class="header-item2">
          <h2>마이페이지</h2>
        </div>
        <div class="header-item2">
          <h2>잡담방</h2>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
