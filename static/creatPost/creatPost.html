<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롤 듀오 찾기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="/static/css/styles.css">
</head>

<!--     --     --     --     --     --     --     --     --     -->

<body>
  <header class="header1">
    <div class="row g-0 header-container">

      <div class="title ">
        롤 듀오 매칭
      </div>
      <div class="header-right">
        <nav>
          <ul class="nav-links">
            <li><a href="#login">로그인</a></li>
            <li><a href="#signup">회원가입</a></li>
            <li><a href="#mypage">마이페이지</a></li>
          </ul>
        </nav>
        <div class="search-bar">
          <input type="text" placeholder="Search" />
          <button>🔍</button>
        </div>
      </div>
      <div class="page ">
        게시글 작성
      </div>
    </div>
  </header>
  <header class="header2">
    <div class="row g-0 header-container2">
      <div class="header-item2 this-title">
        <h2>게시판</h2>
      </div>
      <div class="header-item2">
        <h2>프로필</h2>
      </div>
      <div class="header-item2">
        <h2>마이페이지</h2>
      </div>
      <div class="header-item2">
        <h2>잡담방</h2>
      </div>
    </div>
  </header>


  <div class="post-feed">
    <div class="container">
      <!-- 게시글 -->

      <!--------------------------------->
      <div class="profile-card">
        <div class="card-content">
          <form id="creatPostForm">
            <div class="input-group">
              <label for="postTitle">제목</label>
              <input type="postTitle" id="postTitle" required>
            </div>

            <div class="input-group">
              <label for="postImage">이미지 추가</label>
              <!-- url -->
              <input type="postImage" id="postImage" required>
            </div>

            <div class="input-group">
              <label for="postContent">content</label>
              <input type="postContent" id="postContent" required>
            </div>

            <button id="postSaveButton">저장</button>
          </form>
        </div>
        <!--------------------------------->
      </div>
    </div>
  </div>

  <!-- 해결 방법: JavaScript가 DOM 로드 이후 실행되도록 작성 -->
  <script src="/static/creatPost/creatPost.js"></script>
</body>

</html>
