<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>채팅</title>
  <link rel="stylesheet" href="/static/myPage/myPage.css">
  <script src="../socket.io/socket.io.js"></script>

  <script src="/static/myPage/myPage.js"></script>
</head>

<body>
  <header class="header">
    <div class="header-left">
      <h1>로고</h1>
    </div>
    <div class="header-center">
      <h1>롤 듀오 찾기</h1>
    </div>
    <div class="header-right">
      <nav>
        <ul class="nav-links">
          <li><a href="/login">로그인</a></li>
          <li><a href="/signup">회원가입</a></li>
          <li><a href="/profile">마이페이지</a></li>
        </ul>
      </nav>
      <div class="search-bar">
        <input type="text" placeholder="Search" />
        <button>🔍</button>
      </div>
    </div>
  </header>
  <nav class="tabs">
    <ul>
      <li><a href="#게시판">게시판</a></li>
      <li><a href="#잡담방">잡담방</a></li>
      <li><a href="#내 프로필">내 프로필</a></li>
      <li><a href="#section4">Section 4</a></li>
    </ul>
  </nav>
  <div id="container">
    <div id="proflie">


      <button id="enterChat">채팅에 들어가기</button>
    </div>
    <div id="main">
      <div id="chat">
        <!-- 채팅 메시지 영역 -->
      </div>
      <div>
        <input type="text" id="test" placeholder="메시지를 입력해주세요..">
        <button onclick="send()">전송</button>
      </div>
    </div>
  </div>
  <div id="container">

    <div id="review">
      <div class="review-list">
        <!-- 여기에 후기가 추가될 것입니다. -->
        <div class="review-item">
          <span class="nickname">사용자1</span>
          <span class="comment">정말 좋습니다!</span>
          <span class="rating">★★★★★</span>
        </div>
        <!-- 추가적인 후기는 여기에 동적으로 삽입됩니다. -->
      </div>




      <div id="write-box">
        <textarea id="comment" placeholder="댓글 입력"></textarea>

        <select id="rating">
          <option value="★">★</option>
          <option value="★★">★★</option>
          <option value="★★★">★★★</option>
          <option value="★★★★">★★★★</option>
          <option value="★★★★★">★★★★★</option>
        </select>

        <button id="reviewEnter" type="submit">후기 남기기</button>
      </div>

    </div>


  </div>
</body>

</html>
