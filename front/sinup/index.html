<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롤 듀오 찾기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
  <script src="script.js"></script>
</head>

<!--     --     --     --     --     --     --     --     --     -->

<body>
  <header class="header1">
    <div class="row g-0 header-container">

      <div class="title ">
        롤 듀오 매칭
      </div>
      <div class="header-right">
        <nav>
          <ul class="nav-links">
            <li><a href="#login">로그인</a></li>
            <li><a href="#signup">회원가입</a></li>
            <li><a href="#mypage">마이페이지</a></li>
          </ul>
        </nav>
        <div class="search-bar">
          <input type="text" placeholder="Search" />
          <button>🔍</button>
        </div>
      </div>
      <div class="page ">
        회원가입
      </div>
    </div>
  </header>
  <header class="header2">
    <div class="row g-0 header-container2">
      <div class="header-item2">
        <h2>게시판</h2>
      </div>
      <div class="header-item2">
        <h2>프로필</h2>
      </div>
      <div class="header-item2 this-title">
        <h2>마이페이지</h2>
      </div>
      <div class="header-item2">
        <h2>잡담방</h2>
      </div>
  </header>


  <div>
    <div class="login-sinup-container ">
      <h2>회원가입</h2>
      <form id="login-sinup-Form">
        <div class="input-group">
          <label for="email">이메일 (ID)</label>
          <input type="email" id="email" required>
        </div>
        <div class="input-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" required>
        </div>
        <div class="input-group">
          <label for="confirmPassword">비밀번호 확인</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <div class="input-group">
          <label for="image">이미지등록</label>
          <input type="text" id="image" required>
        </div>
        <div class="input-group">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" required>
        </div>
        <div class="center-button-container">

          <button class="naver-button " type="submit">Naver</button>
          <button class="center-button " type="submit">회원가입</button>
        </div>
      </form>
      <p id="signupMessage"></p>
    </div>
  </div>

</body>

</html>
